# 사용자에게 나가는 고정 문구·표준 문구 (한 곳에서만 정의). 자리표시자는 $name.
# 원칙: '안전합니다' 금지, 실패·범위 밖은 "정보 없음"이고 위험 여부를 알 수 없다는 뜻 (ADR-004).
# 2026-10-20 문구 완화(ADR-016): 의미는 그대로(정보 없음 ≠ 안전), 방어적 표현만 부드럽게. 제안 출처 doc/FE_개선_준비.md

supported_regions: 광주광역시, 경기도 광주시

# 검증기가 답변에서 찾는 표준 문구 조각. 아래 문구들이 이 조각을 포함하는지 기동 시 검사한다 (config/catalog.py).
markers:
  no_info: 정보 없음              # 조회 실패·범위 밖
  no_risk: 확인된 위험 정보 없음  # 위험 없음의 유일한 표현
  no_guarantee: 공식 채널도 함께 확인   # 위험 정보 없음 뒤 '단정하지 않음' 문장 (인용 없이 허용)
  official: 공식 경보             # 면책
  emergency_call: "119"
  not_in_data: 해당 항목이 없습니다   # 공식 데이터에 없는 행동요령 (지어내지 않음)
  shelter_notice: 운영 여부·운영 시간은 이 목록에 없어   # [S#] 인용 시 필수 (운영 단정 금지)

disclaimer: 공식 데이터(기상청·행정안전부)를 정리한 안내로, 공식 경보를 대신하지 않습니다. 위급하면 즉시 119·112에 연락하고 공식 채널(기상청, 재난문자, 국민재난안전포털)에서 최종 확인해 주세요.

# route / gate 고정 응답 (LLM 미사용)
fixed:
  emergency: >-
    위급한 상황이면 지금 바로 119(소방·구조) 또는 112(경찰)에 전화하세요.
    안전한 높은 곳이나 튼튼한 건물로 이동하고, 위험 지역에서 벗어나세요.
    이 안내는 공식 경보를 대신하지 않으며, 위급 상황의 판단을 대신하지 않습니다.
  out_of_scope: >-
    이 서비스는 특보·재난문자·행동요령 정보를 지역별로 정리해 드립니다.
    현재 지원 지역은 ${supported_regions}입니다. 재난·특보 관련 질문을 지역과 함께 해 주세요.
    (예: '경기도 광주 강풍특보 났는데 지금 나가도 돼?')
  # 데이터 서비스(MCP) 자체에 연결하지 못했을 때 (gate). $reason = causes.<원인>
  service_unavailable: >-
    정보 없음 — 지금은 특보·재난문자를 확인할 수 없어 위험 여부를 알 수 없습니다. $reason.
    이 안내는 공식 경보를 대신하지 않습니다. 위급하면 즉시 119·112에 연락하고,
    공식 채널(기상청, 재난문자, 국민재난안전포털)에서 직접 확인해 주세요.
  # 공식 데이터에 없는 질문 (route=not_in_data, rules.yaml not_in_official_data)
  not_in_data: >-
    정보 없음 — '$topic': 공식 행동요령 데이터(행정안전부 국민행동요령)에 해당 항목이 없습니다.
    근거 없는 방법을 지어내 안내하지 않습니다.
    위급하면 즉시 119·112에 전화하세요. 이 안내는 공식 경보를 대신하지 않으며,
    공식 채널(기상청, 재난문자, 국민재난안전포털)에서 확인해 주세요.
  ask_region: >-
    어느 지역인지 알려 주세요. 현재 지원 지역은 ${supported_regions}입니다.
    (예: '광주광역시', '경기도 광주시')

# 템플릿 답변 (compose — FakeLLM 출력이자 검증 실패 시 대체)
answer:
  unknown: 정보 없음 — 지금은 기상특보를 확인할 수 없어 위험 여부를 알 수 없습니다. 공식 채널(기상청, 재난문자)에서 직접 확인해 주세요.
  none: 확인된 위험 정보 없음 (기준 $as_of, 조회 구역 $zones). 상황은 수시로 바뀔 수 있으니 공식 채널도 함께 확인해 주세요.
  level: $level_label (기준 $as_of)
  uncertain_suffix: " (해석이 불확실한 발표코드 — 공식 확인 필요)"
  message_scope: {sido_wide: 시도 전체, direct: 해당 지역}
  guide_header: "행동요령 (행정안전부 국민행동요령, 항목마다 출처 표기):"
  guide_group: "▶ $label ($hazard)"
  gap: "- 정보 없음: $source — $reason. 위험 여부는 공식 채널에서 확인해 주세요."
  gap_unavailable: "- 정보 없음: $source — $reason."
  go_out: ※ 외출 가능 여부는 이 서비스가 판단하지 않습니다. 위 확인된 정보와 행동요령을 참고해 직접 판단하세요.

# judge 가 붙이는 설명
judge:
  since_before_window: 발효 시각은 조회 범위 이전 — 이후 해제 발표로 확인
  messages_only_note: 기상특보는 확인되지 않았지만 최근 해당 지역에 안내 문자가 있습니다. 문자는 수준 판정에 쓰지 않고 참고로만 표시합니다.

# 카카오맵 링크 칩 (ADR-011). 경로를 판단하지 않는다 — 링크로 넘기기까지만
kakao:
  route_notice: 경로상의 도로 통제·침수 여부는 반영되지 않았습니다.
  map_label: 카카오맵에서 보기
  route_label: 카카오맵 길찾기

# MCP 도구 응답의 statement
mcp:
  alert_failed: 정보 없음 — 기상특보는 $reason. 위험 여부를 알 수 없으니 공식 채널에서 확인해 주세요.
  alert_active: 발효 중인 특보 $count건 (기준 $as_of)
  alert_none: 확인된 위험 정보 없음 (기준 $as_of, 조회 구역 $zones, 기상특보 $pending). 상황은 수시로 바뀔 수 있으니 공식 채널도 함께 확인해 주세요.
  alert_none_pending: 예고 $count건 있음
  alert_none_no_pending: 발효 중 없음
  messages_failed: 정보 없음 — 재난문자는 $reason. 문자가 없었다는 뜻은 아닙니다.
  messages_count: 최근 $hours시간 해당 지역 재난문자 $count건
  # 백엔드가 MCP 호출 자체에 실패했을 때 (graph._failed_alert)
  alert_unreachable: 정보 없음 — 기상특보는 $reason. 위험 여부를 알 수 없으니 공식 채널에서 확인해 주세요.

# 조회 실패 원인별 문구 (ADR-014). gap·statement 의 $reason 자리에 들어간다. 원인 코드는 config/catalog.py CAUSE_CODES.
# 화면에는 이 문구만, 원인 코드·상세는 개발자 상세(자세히 보기)에만.
causes:
  api_auth_error: 서비스 인증 설정 문제로 지금은 불러오지 못했습니다(점검 필요)
  rate_limited: 요청이 많아(호출 한도) 지금은 불러오지 못했습니다. 잠시 후 다시 시도해 주세요
  api_http_error: 제공기관 서버 오류로 지금은 불러오지 못했습니다
  api_result_error: 제공기관 응답 오류로 지금은 불러오지 못했습니다. 잠시 후 다시 시도해 주세요
  api_timeout: 제공기관 응답이 늦어 지금은 불러오지 못했습니다. 다시 시도해 주세요
  network_error: 일시적인 네트워크 문제로 지금은 불러오지 못했습니다
  response_invalid: 받은 데이터의 형식이 예상과 달라 읽지 못했습니다
  mcp_unreachable: 내부 데이터 서비스에 연결하지 못해 불러오지 못했습니다
  mcp_tool_error: 내부 데이터 서비스 처리 중 오류가 나 불러오지 못했습니다
  no_coverage: 시연 데이터가 이 시각을 덮지 않아 확인할 수 없습니다. 실시간 모드로 확인해 보세요
  unknown: 원인을 확인하지 못한 오류로 불러오지 못했습니다
  not_in_data: 공식 행동요령 데이터(행정안전부 국민행동요령)에 해당 항목이 없습니다

# 쉼터·대피장소 (통합대피소). "공식 목록에 있는 장소"까지만 — 운영 여부·시간은 모른다고 밝힌다. 가까운 곳·이용 가능 단정 금지.
# 목록은 가까운 순이 아니다(좌표를 받지 않음). 지도는 이름·주소 검색 링크 칩으로만 (경로 판단 없음)
shelters:
  header: "공식 목록에 있는 $kind_label 일부 ($hazard · $source): 운영 여부·운영 시간은 이 목록에 없어 확인되지 않았습니다. 위치 순서가 아니며, 이용 전 해당 시설이나 시·군·구에 확인해 주세요."
  source_name: 쉼터 목록
  map_label: 카카오맵에서 찾기
  map_notice: 이름·주소 검색 결과로 넘어갑니다. 운영 여부와 경로상의 통제·침수 여부는 반영되지 않았습니다.

# 행동요령 묶음 제목 (ADR-016). 특보가 발효 중이 아닌 유형은 now 대신 now_inactive
guide_groups:
  now: 지금 할 일
  now_inactive: 발생하면 할 일
  prepare: 미리 대비할 일
  dont: 하지 말 것
