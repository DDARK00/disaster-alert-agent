# 사용자에게 나가는 고정 문구·표준 문구 (한 곳에서만 정의). 자리표시자는 $name.
# 원칙: '안전합니다' 금지, 실패·범위 밖은 "정보 없음 — 안전하다는 뜻이 아닙니다" (ADR-004)

supported_regions: 광주광역시, 경기도 광주시

disclaimer: 공식 경보가 아닙니다. 위급할 때는 119·112, 공식 채널(기상청, 재난문자, 국민재난안전포털)을 확인하세요.

# route / gate 고정 응답 (LLM 미사용)
fixed:
  emergency: >-
    위급한 상황이면 지금 바로 119(소방·구조) 또는 112(경찰)에 전화하세요.
    안전한 높은 곳이나 튼튼한 건물로 이동하고, 위험 지역에서 벗어나세요.
    이 서비스는 공식 경보가 아니며, 위급 상황의 판단을 대신하지 않습니다.
  out_of_scope: >-
    이 서비스는 특보·재난문자·행동요령 정보를 지역별로 정리해 드립니다.
    현재 지원 지역은 ${supported_regions}입니다. 재난·특보 관련 질문을 지역과 함께 해 주세요.
    (예: '경기도 광주 강풍특보 났는데 지금 나가도 돼?')
  ask_region: >-
    어느 지역인지 알려 주세요. 현재 지원 지역은 ${supported_regions}입니다.
    (예: '광주광역시', '경기도 광주시')

# 템플릿 답변 (compose — FakeLLM 출력이자 검증 실패 시 대체)
answer:
  unknown: 정보 없음 — 기상특보를 조회하지 못했습니다. 이는 안전하다는 뜻이 아닙니다.
  none: 확인된 위험 정보 없음 (기준 $as_of, 조회 구역 $zones). 안전을 보장하지 않습니다.
  level: $level_label (기준 $as_of)
  uncertain_suffix: " (해석이 불확실한 발표코드 — 공식 확인 필요)"
  message_scope: {sido_wide: 시도 전체, direct: 해당 지역}
  guide_header: "행동요령 (행정안전부 자연재난국민행동요령):"
  gap: "- 정보 없음: $source ($status) — 안전하다는 뜻이 아닙니다."
  go_out: ※ 외출 가능 여부는 이 서비스가 판단하지 않습니다. 위 확인된 정보와 행동요령을 참고해 직접 판단하세요.

# judge 가 붙이는 설명
judge:
  messages_only_note: 기상특보는 확인되지 않았지만 최근 해당 지역에 안내 문자가 있습니다. 문자는 수준 판정에 쓰지 않고 참고로만 표시합니다.

# MCP 도구 응답의 statement
mcp:
  alert_failed: 정보 없음 — 특보를 조회하지 못했습니다($status). 이는 안전하다는 뜻이 아닙니다.
  alert_active: 발효 중인 특보 $count건 (기준 $as_of)
  alert_none: 확인된 위험 정보 없음 (기준 $as_of, 조회 구역 $zones, 기상특보 $pending). 안전을 보장하지 않습니다.
  alert_none_pending: 예고 $count건 있음
  alert_none_no_pending: 발효 중 없음
  messages_failed: 정보 없음 — 재난문자를 조회하지 못했습니다($status). 이는 문자가 없다는 뜻이 아닙니다.
  messages_count: 최근 $hours시간 해당 지역 재난문자 $count건
  # 백엔드가 MCP 호출 자체에 실패했을 때 (graph._failed_alert)
  alert_unreachable: 정보 없음 — 특보를 조회하지 못했습니다. 이는 안전하다는 뜻이 아닙니다.
