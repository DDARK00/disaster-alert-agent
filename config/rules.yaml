# 규칙 사전 (데이터만). 판정·라우팅·검증 로직은 코드에 있다 (ADR-002, ADR-012).
#
# 매칭 방식
#   - emergency_words / intent_words : 정규식으로 컴파일. 단어 안의 공백 = 공백 0개 이상(\s*), 나머지는 글자 그대로.
#   - hazard_synonyms / generic_disaster_words / region_words / forbidden / niche_words : 부분 문자열 포함 여부.

# 위급 표현 → LLM·도구 없이 고정 119/112 안내 (route 가 항상 먼저 본다)
emergency_words:
  - 물 차오
  - 물이 차오
  - 물 차올
  - 물이 차올
  - 침수되
  - 침수돼
  - 침수됐
  - 갇혔
  - 갇혀
  - 떠내려
  - 살려
  - 구조해
  - 구조요청
  - 도와줘
  - 도와주세요
  - 도와주십시오
  - 무너졌
  - 무너지고
  - 무너질
  - 불 났
  - 불이 났
  - 불 나고
  - 불이 나고
  - 불 붙
  - 불이 붙
  - 다쳤
  - 의식 없
  - 의식이 없
  - 의식 잃
  - 의식이 잃
  - 숨 못
  - 숨을 못
  - 대피해야 있
  - 대피중 있
  - 대피하고 있
  - 지금 당장
  - 급해
  - 위급

# 의도 (go_out 이 guide 보다 우선)
intent_words:
  go_out: [나가, 나갈, 외출, 이동, 출근, 퇴근, 운전, 가도, 가야, 가려, 출발, 등산, 산책, 성묘]
  guide: [행동요령, 어떻게, 뭘 해야, 무엇을, 대비, 준비, 조심, 주의사항]

# 재난 유형 동의어 (이름은 data/hazard_map.json 과 일치해야 함 — 테스트가 검증)
hazard_synonyms:
  강풍: [강풍, 돌풍, 바람이, 바람도, 바람은, 바람 많이, 바람 세, 강한 바람]
  호우: [호우, 폭우, 집중호우, 장마, 소나기, 비가, 비 많이, 비 와, 비 오, 비가 많이, 빗물, 침수]
  한파: [한파, 추위, 동파, 얼어, 기온이 떨어]
  건조: [건조특보, 건조주의보, 건조경보, 건조]
  폭풍해일: [폭풍해일, 해일]
  풍랑: [풍랑, 파도, 높은 파도]
  태풍: [태풍]
  대설: [대설, 폭설, 눈이 많이, 눈이 와, 눈이 오, 적설]
  황사: [황사]
  폭염: [폭염, 무더위, 더위, 찜통]
  열대야: [열대야]
  # 기상특보가 없는 유형 (행동요령만, warnVar=null). 소스는 hazard_map.json 의 source (ADR-013)
  지진: [지진, 여진]
  화재: [화재, 불이 나면, 불 나면, 불났을 때, 소화기]
  산불: [산불]
  정전: [정전, 전기가 나가, 전기가 끊]
  교통사고: [교통사고, 접촉사고, 차 사고]
  미세먼지: [미세먼지, 초미세먼지]
  민방공: [민방공, 공습경보, 경계경보, 민방위 경보]

# 범위 판단: 재난 유형·아래 단어·지역 단어 중 하나도 없으면 범위 밖
generic_disaster_words: [특보, 재난, 경보, 주의보, 날씨, 위험, 안전, 대피, 재난문자, 행동요령, 기상]
region_words: [광주, 경기, 전남, 전라, 서울, 부산, 대구, 인천, 대전, 울산, 세종, 강원, 충, 경상, 제주]

# 장소 표현에서 지명·행정구역 접미를 뺀 뒤 남는 것이 없으면 '지역명뿐'으로 보고 Kakao 로 보내지 않는다
# ('광주'만으로 한쪽 지역을 고르면 모호 지명 원칙이 깨진다, ADR-006)
region_suffixes: [통합특별시, 특별자치시, 특별자치도, 특별시, 광역시, 도, 시, 군, 구]
# 막연한 위치 표현 — 이것만 남으면 장소가 아니다(Kakao 로 보내지 않음). '우리 동네'가 Kakao 1위 장소(다른 지역)로
# 바뀌어 지역이 가정되던 문제(T-033)
vague_place_words: [우리 동네, 우리동네, 이 동네, 동네, 우리 집, 우리집, 이 근처, 근처, 주변, 여기, 이곳, 거기, 현재 위치, 내 위치, 지금 있는 곳, 사는 곳]

# 답변 금지 표현 (validator 가 차단)
forbidden:
  - 안전합니다
  - 안전해요
  - 안전하니
  - 안전합니다만
  - 걱정하지 마
  - 걱정 마
  - 문제없
  - 문제 없
  - 괜찮습니다
  - 괜찮아요
  - 위험하지 않
  - 위험 없
  - 안심하
  # 지도 링크와 함께 쓰일 수 있는 경로 안전 단정 (ADR-011).
  # '안전한 곳/장소'는 공식 행동요령 원문("안전한 곳으로 대피")에 있어 넣지 않는다 (T-024)
  - 가장 안전한
  - 안전한 경로
  - 안전한 길
  # 쉼터 목록은 위치 순서·운영 여부를 모른다 — 가까움·운영 단정 금지 (공식 행동요령 원문 0건 확인, 2026-10-20)
  - 가까운 쉼터
  - 가까운 대피
  - 운영 중인 쉼터
  - 운영하고 있습니다

# 위험 수준 (judge 가 사용). rank 는 표시 순서일 뿐 unknown 이 낮은 위험이라는 뜻이 아님
levels:
  labels:
    unknown: 정보 없음
    none: 확인된 위험 정보 없음
    upcoming: 특보 발효 예고
    advisory: 주의보 발효 중
    warning: 경보 발효 중
    severe: 중대경보 발효 중
  stress_to_level: {주의보: advisory, 경보: warning, 중대경보: severe}
  rank: {none: 1, upcoming: 2, advisory: 3, warning: 4, severe: 5}

# 근거 개수 상한과 일반 시민 대상이 아닌 행동요령 문구(뒤로 미룸, 삭제하지 않음)
evidence:
  max_messages: 3
  max_guide_per_hazard: 7   # = guide_groups.limits 합 (묶음별 상한이 실제 기준)
niche_words: [가축, 어류, 양식, 축사, 농작물, 비닐하우스, 작업장, 건설 현장, 건설현장, 어선, 선박]

# 외부 API 오류 분류용 코드·키워드 (mcp_server/failures.py 가 판정, ADR-014).
# data.go.kr 공통 오류코드: 20 접근 거부, 21 키 일시 정지, 30 키 미등록, 31 기간 만료, 32 IP 미등록, 33 서명 안 됨 / 22 호출 한도 초과
api_errors:
  auth_codes: ["20", "21", "30", "31", "32", "33"]
  auth_words: [SERVICE_KEY_IS_NOT_REGISTERED, SERVICE_ACCESS_DENIED, DEADLINE_HAS_EXPIRED, UNREGISTERED_IP, TEMPORARILY_DISABLE_THE_SERVICEKEY]
  limit_codes: ["22"]
  limit_words: [LIMITED_NUMBER_OF_SERVICE_REQUESTS]

# 행동요령 대상 필터 (ADR-015): 일반 시민용이 아닌 행(구조대원·관리자·전문가 작업 지침)은 근거에서 뺀다.
# 판정은 mcp_server/guides.py for_citizens (코드). 단계명(safety_cate_nm3)·본문 키워드 기준, cate2 "*" = 모든 유형.
# 근거: doc/API_응답_스키마.md §4 + 2026-10-20 수집 fixture 를 읽고 정함 (T-031).
guide_audience:
  exclude_sections:
    - {cate2: "03013", words: [차량에서의 구조, 상황판단, 구출]}   # 교통사고: 구조대원 작업 지침 ("작업을 부여 받은 대원…")
    - {cate2: "02022", words: [식별]}                              # 테러: 식별요령 (현재 미연결, 연결 시 대비)
  exclude_text_words: [현장통제를 구축, 차량을 전개, "관련근거 :"]   # 비교는 정규화(앞 기호 제거) 뒤 본문 기준

# 공식 데이터에 없는 질문 (ADR-015). 모든 단어 묶음에서 하나 이상이 질문에 있으면 route=not_in_data →
# LLM·도구 없이 "공식 데이터에 없음" 고정 응답 (지어내지 않는다). 위급 표현이 있으면 emergency 가 먼저다.
# 근거: 행동요령 4종 1,466행 검색에서 차량+침수 0건, 지하차도·목받침 0건 (doc/API_응답_스키마.md §4)
not_in_official_data:
  - topic: 차량 침수 시 탈출
    all_of:
      - [차량, 자동차, 차가, 차 안, 차에서, 차를, 운전 중]
      - [침수, 물에 잠, 잠기, 물이 차, 지하차도]
      - [탈출, 빠져나, 문이 안 열, 창문, 깨고, 요령, 방법, 어떻게]

# 행동요령 구조화 "그래서 어떻게" (ADR-016, ADR-020). 판정은 backend/agent/judge.py group_guides (코드), 여기는 데이터만.
#   1) 문장의 핵심 서술이 금지일 때만 '하지 말 것' (judge.is_prohibition): 문장·쉼표로 나눈 조각 중 금지 표현(dont_words, 끝의 dont_endings)이 있는 조각이
#      있고, 권고 조각(금지 표현 없이 recommend_endings 로 끝나는 조각 또는 문장의 마지막 조각)이 하나도 없을 때.
#      "물을 많이 마시고, 카페인 음료는 마시지 않습니다"처럼 섞인 문장은 쪼개지 않고 단계 묶음(지금 할 일 등)에 둔다 —
#      권고("물을 많이 마시고")가 '하지 말 것' 아래에 놓여 반대로 읽히는 오분류가 더 위험하기 때문 (금지 서술은 원문에 그대로 남는다)
#   2) 아니면 단계(hazard_map phases, cate3 기준)로 phase_to_group. info·after 단계는 넣지 않는다(예외: must_actions → symptom).
#   3) 거의 같은 행은 하나만 (similar_threshold: 공백·기호를 뺀 글자 2-gram Dice 계수). 한 지역 안에서 묶음 순서대로 먼저 고른 행을
#      남기고 뒤의 것을 건너뛴 뒤 다음 후보로 채운다 (결정적).
#   특보 발효 중인 유형은 now 를 먼저, 아니면 prepare 를 먼저 보인다.
guide_groups:
  dont_words: [맙시다, 마십시오, 말아야, 지 않습니다, 삼가, 서는 안 되, 서는 안되]   # 조각 어디에 있어도 금지 (2026-10-20·21 fixture 에서 확인, '에서는 안전한'과 구분)
  dont_endings: [지 말고, 지 말며, 지 않고, 지 않으며]               # 조각 끝에 올 때만 금지 ('당황하지 않고 대피합니다'는 권고)
  recommend_endings: [고, 며, 하여, 해서, 면서]
  phase_to_group: {during: now, prepare: prepare}
  limits: {now: 3, symptom: 2, prepare: 2, dont: 2}
  limits_multi: {now: 2, symptom: 1, prepare: 1, dont: 1}   # 한 지역에 행동요령 유형이 둘 이상이면 (답변 길이 제한)
  # 한 지역의 행동요령 전체 상한 (K7). 넘치면 필수 행동 > 단계 일치 > 고른 순서로 남긴다 (judge.cap_guides).
  # 근거: qwen3:8b 초당 약 20토큰, 폭염경보 답변 출력 약 1,080토큰·write 54초(행동요령 9 + 쉼터 3, 2026-10-21 측정)
  max_total: 7
  order_active: [now, symptom, prepare, dont]
  order_inactive: [prepare, now, dont]
  similar_threshold: 0.4    # 폭염 '냉방이 되지 않는 실내…' 두 행 0.44, '카페인…' 두 행 0.49, 서로 다른 행은 대개 0.2 이하 (2026-10-21 측정)

# 필수 행동 (ADR-020): 특보 발효 중이면 증상·응급 대처 행을 '증상이 있으면'(symptom) 묶음으로 반드시 넣는다 (코드가 고른다).
# rows: 단어 묶음 목록 — 행 본문이 한 묶음의 단어를 모두 포함하면 해당. 목록 순서가 우선순위, 상한은 guide_groups.limits.symptom.
# 단계와 무관하게 찾는다(폭염은 '폭염관련 정보'(info) 단계에 있음). 증상 설명 행은 넣지 않고 대처요령 행만.
must_actions:
  폭염: {rows: [[열사병, 대처요령], [열경련, 대처요령], [울열증, 대처요령]]}
  한파: {rows: [[저체온, 병원], [동상에 걸렸을]]}

# 쉼터·대피장소 (통합대피소 DSSP-IF-10941). 판정·필터는 mcp_server/shelters.py (코드), 여기는 데이터만.
# 구분 코드와 이름이 1:1이 아니다 — 코드 1 에도 "한파쉼터,무더위쉼터" 복합 항목이 섞여 온다(doc/API_응답_스키마.md §5).
#   codes      요청 shlt_se_cd (코드별로 따로 호출)
#   name_word  응답 SHLT_SE_NM 에 이 단어가 있어야 채택 (null 이면 SHLT_SE_CD 에 codes 중 하나가 있어야 채택)
# 결과는 '가까운 순'이 아니다(사용자 좌표를 받지 않는다). 지역 주소 필터 뒤 sort_by 순으로 정렬해 limit 개만 — 같은 입력은 같은 출력.
# 호우·태풍·대설용 구분은 API 에 없다 → hazard_map.json 의 shelter 는 폭염·한파·지진에만 둔다.
shelters:
  limit: 3
  max_pages: 3          # 지역 주소 필터 뒤 limit 개가 찰 때까지 코드별 최대 쪽 수
  cache_hours: 6        # live: (지역, 구분) 단위 캐시 시간 (sources.yaml cache: region_hours)
  sort_by: [address, name, id]
  kinds:
    heat: {label: 무더위쉼터, codes: ["2"], name_word: 무더위}
    cold: {label: 한파쉼터, codes: ["1"], name_word: 한파}
    quake: {label: 지진 옥외대피장소, codes: ["3", "4"], name_word: null}

# 조회 계획 (ADR-018): 의도 → 조회 단계. 적용은 backend/agent/graph.py rule_plan (코드). 특보(alerts)는 항상 넣는다.
# 근거: qwen 계획 LLM 이 28건 중 27건에서 의도만으로 같은 단계를 골랐다(T-032). 규칙으로 정해지지 않던 go_out
# (qwen 2건 중 1건만 행동요령 포함)은 행동요령을 넣는다 — 외출 판단에는 '하지 말 것'이 필요하고, 결정을 매번 같게 하기 위해.
# 쉼터는 계획과 무관하게 코드가 붙인다(hazard_map shelter).
plan_steps:
  status: [alerts, messages]
  guide: [alerts, guide]
  go_out: [alerts, messages, guide]
