# 규칙 사전 (데이터만). 판정·라우팅·검증 로직은 코드에 있다 (ADR-002, ADR-012).
#
# 매칭 방식
#   - emergency_words / intent_words : 정규식으로 컴파일. 단어 안의 공백 = 공백 0개 이상(\s*), 나머지는 글자 그대로.
#   - hazard_synonyms / generic_disaster_words / region_words / forbidden / niche_words : 부분 문자열 포함 여부.

# 위급 표현 → LLM·도구 없이 고정 119/112 안내 (route 가 항상 먼저 본다)
emergency_words:
  - 물 차오
  - 물이 차오
  - 물 차올
  - 물이 차올
  - 침수되
  - 침수돼
  - 침수됐
  - 갇혔
  - 갇혀
  - 떠내려
  - 살려
  - 구조해
  - 구조요청
  - 도와줘
  - 도와주세요
  - 도와주십시오
  - 무너졌
  - 무너지고
  - 무너질
  - 불 났
  - 불이 났
  - 불 나고
  - 불이 나고
  - 불 붙
  - 불이 붙
  - 다쳤
  - 의식 없
  - 의식이 없
  - 의식 잃
  - 의식이 잃
  - 숨 못
  - 숨을 못
  - 대피해야 있
  - 대피중 있
  - 대피하고 있
  - 지금 당장
  - 급해
  - 위급

# 의도 (go_out 이 guide 보다 우선)
intent_words:
  go_out: [나가, 나갈, 외출, 이동, 출근, 퇴근, 운전, 가도, 가야, 가려, 출발, 등산, 산책, 성묘]
  guide: [행동요령, 어떻게, 뭘 해야, 무엇을, 대비, 준비, 조심, 주의사항]

# 재난 유형 동의어 (이름은 data/hazard_map.json 과 일치해야 함 — 테스트가 검증)
hazard_synonyms:
  강풍: [강풍, 돌풍, 바람이, 바람도, 바람은, 바람 많이, 바람 세, 강한 바람]
  호우: [호우, 폭우, 집중호우, 장마, 소나기, 비가, 비 많이, 비 와, 비 오, 비가 많이, 빗물, 침수]
  한파: [한파, 추위, 동파, 얼어, 기온이 떨어]
  건조: [건조특보, 건조주의보, 건조경보, 건조]
  폭풍해일: [폭풍해일, 해일]
  풍랑: [풍랑, 파도, 높은 파도]
  태풍: [태풍]
  대설: [대설, 폭설, 눈이 많이, 눈이 와, 눈이 오, 적설]
  황사: [황사, 미세먼지]
  폭염: [폭염, 무더위, 더위, 찜통]
  열대야: [열대야]

# 범위 판단: 재난 유형·아래 단어·지역 단어 중 하나도 없으면 범위 밖
generic_disaster_words: [특보, 재난, 경보, 주의보, 날씨, 위험, 안전, 대피, 재난문자, 행동요령, 기상]
region_words: [광주, 경기, 전남, 전라, 서울, 부산, 대구, 인천, 대전, 울산, 세종, 강원, 충, 경상, 제주]

# 장소 표현에서 지명·행정구역 접미를 뺀 뒤 남는 것이 없으면 '지역명뿐'으로 보고 Kakao 로 보내지 않는다
# ('광주'만으로 한쪽 지역을 고르면 모호 지명 원칙이 깨진다, ADR-006)
region_suffixes: [통합특별시, 특별자치시, 특별자치도, 특별시, 광역시, 도, 시, 군, 구]

# 답변 금지 표현 (validator 가 차단)
forbidden:
  - 안전합니다
  - 안전해요
  - 안전하니
  - 안전합니다만
  - 걱정하지 마
  - 걱정 마
  - 문제없
  - 문제 없
  - 괜찮습니다
  - 괜찮아요
  - 위험하지 않
  - 위험 없
  - 안심하
  # 지도 링크와 함께 쓰일 수 있는 경로 안전 단정 (ADR-011).
  # '안전한 곳/장소'는 공식 행동요령 원문("안전한 곳으로 대피")에 있어 넣지 않는다 (T-024)
  - 가장 안전한
  - 안전한 경로
  - 안전한 길

# 위험 수준 (judge 가 사용). rank 는 표시 순서일 뿐 unknown 이 낮은 위험이라는 뜻이 아님
levels:
  labels:
    unknown: 정보 없음
    none: 확인된 위험 정보 없음
    upcoming: 특보 발효 예고
    advisory: 주의보 발효 중
    warning: 경보 발효 중
    severe: 중대경보 발효 중
  stress_to_level: {주의보: advisory, 경보: warning, 중대경보: severe}
  rank: {none: 1, upcoming: 2, advisory: 3, warning: 4, severe: 5}

# 근거 개수 상한과 일반 시민 대상이 아닌 행동요령 문구(뒤로 미룸, 삭제하지 않음)
evidence:
  max_messages: 3
  max_guide_per_hazard: 4
niche_words: [가축, 어류, 양식, 축사, 농작물, 비닐하우스, 작업장, 건설 현장, 건설현장, 어선, 선박]
