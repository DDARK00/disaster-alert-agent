# 규칙 사전 (데이터만). 판정·라우팅·검증 로직은 코드에 있다 (ADR-002, ADR-012).
#
# 매칭 방식
#   - emergency_words / intent_words : 정규식으로 컴파일. 단어 안의 공백 = 공백 0개 이상(\s*), 나머지는 글자 그대로.
#   - hazard_synonyms / generic_disaster_words / region_words / forbidden / niche_words : 부분 문자열 포함 여부.

# 위급 표현 → LLM·도구 없이 고정 119/112 안내 (route 가 항상 먼저 본다)
emergency_words:
  - 물 차오
  - 물이 차오
  - 물 차올
  - 물이 차올
  - 침수되
  - 침수돼
  - 침수됐
  - 갇혔
  - 갇혀
  - 떠내려
  - 살려
  - 구조해
  - 구조요청
  - 도와줘
  - 도와주세요
  - 도와주십시오
  - 무너졌
  - 무너지고
  - 무너질
  - 불 났
  - 불이 났
  - 불 나고
  - 불이 나고
  - 불 붙
  - 불이 붙
  - 다쳤
  - 의식 없
  - 의식이 없
  - 의식 잃
  - 의식이 잃
  - 숨 못
  - 숨을 못
  - 대피해야 있
  - 대피중 있
  - 대피하고 있
  - 지금 당장
  - 급해
  - 위급

# 의도 (go_out 이 guide 보다 우선)
intent_words:
  go_out: [나가, 나갈, 외출, 이동, 출근, 퇴근, 운전, 가도, 가야, 가려, 출발, 등산, 산책, 성묘]
  guide: [행동요령, 어떻게, 뭘 해야, 무엇을, 대비, 준비, 조심, 주의사항]

# 재난 유형 동의어 (이름은 data/hazard_map.json 과 일치해야 함 — 테스트가 검증)
hazard_synonyms:
  강풍: [강풍, 돌풍, 바람이, 바람도, 바람은, 바람 많이, 바람 세, 강한 바람]
  호우: [호우, 폭우, 집중호우, 장마, 소나기, 비가, 비 많이, 비 와, 비 오, 비가 많이, 빗물, 침수]
  한파: [한파, 추위, 동파, 얼어, 기온이 떨어]
  건조: [건조특보, 건조주의보, 건조경보, 건조]
  폭풍해일: [폭풍해일, 해일]
  풍랑: [풍랑, 파도, 높은 파도]
  태풍: [태풍]
  대설: [대설, 폭설, 눈이 많이, 눈이 와, 눈이 오, 적설]
  황사: [황사]
  폭염: [폭염, 무더위, 더위, 찜통]
  열대야: [열대야]
  # 기상특보가 없는 유형 (행동요령만, warnVar=null). 소스는 hazard_map.json 의 source (ADR-013)
  지진: [지진, 여진]
  화재: [화재, 불이 나면, 불 나면, 불났을 때, 소화기]
  산불: [산불]
  정전: [정전, 전기가 나가, 전기가 끊]
  교통사고: [교통사고, 접촉사고, 차 사고]
  미세먼지: [미세먼지, 초미세먼지]
  민방공: [민방공, 공습경보, 경계경보, 민방위 경보]

# 범위 판단: 재난 유형·아래 단어·지역 단어 중 하나도 없으면 범위 밖
generic_disaster_words: [특보, 재난, 경보, 주의보, 날씨, 위험, 안전, 대피, 재난문자, 행동요령, 기상]
region_words: [광주, 경기, 전남, 전라, 서울, 부산, 대구, 인천, 대전, 울산, 세종, 강원, 충, 경상, 제주]

# 장소 표현에서 지명·행정구역 접미를 뺀 뒤 남는 것이 없으면 '지역명뿐'으로 보고 Kakao 로 보내지 않는다
# ('광주'만으로 한쪽 지역을 고르면 모호 지명 원칙이 깨진다, ADR-006)
region_suffixes: [통합특별시, 특별자치시, 특별자치도, 특별시, 광역시, 도, 시, 군, 구]

# 답변 금지 표현 (validator 가 차단)
forbidden:
  - 안전합니다
  - 안전해요
  - 안전하니
  - 안전합니다만
  - 걱정하지 마
  - 걱정 마
  - 문제없
  - 문제 없
  - 괜찮습니다
  - 괜찮아요
  - 위험하지 않
  - 위험 없
  - 안심하
  # 지도 링크와 함께 쓰일 수 있는 경로 안전 단정 (ADR-011).
  # '안전한 곳/장소'는 공식 행동요령 원문("안전한 곳으로 대피")에 있어 넣지 않는다 (T-024)
  - 가장 안전한
  - 안전한 경로
  - 안전한 길

# 위험 수준 (judge 가 사용). rank 는 표시 순서일 뿐 unknown 이 낮은 위험이라는 뜻이 아님
levels:
  labels:
    unknown: 정보 없음
    none: 확인된 위험 정보 없음
    upcoming: 특보 발효 예고
    advisory: 주의보 발효 중
    warning: 경보 발효 중
    severe: 중대경보 발효 중
  stress_to_level: {주의보: advisory, 경보: warning, 중대경보: severe}
  rank: {none: 1, upcoming: 2, advisory: 3, warning: 4, severe: 5}

# 근거 개수 상한과 일반 시민 대상이 아닌 행동요령 문구(뒤로 미룸, 삭제하지 않음)
evidence:
  max_messages: 3
  max_guide_per_hazard: 7   # = guide_groups.limits 합 (묶음별 상한이 실제 기준)
niche_words: [가축, 어류, 양식, 축사, 농작물, 비닐하우스, 작업장, 건설 현장, 건설현장, 어선, 선박]

# 외부 API 오류 분류용 코드·키워드 (mcp_server/failures.py 가 판정, ADR-014).
# data.go.kr 공통 오류코드: 20 접근 거부, 21 키 일시 정지, 30 키 미등록, 31 기간 만료, 32 IP 미등록, 33 서명 안 됨 / 22 호출 한도 초과
api_errors:
  auth_codes: ["20", "21", "30", "31", "32", "33"]
  auth_words: [SERVICE_KEY_IS_NOT_REGISTERED, SERVICE_ACCESS_DENIED, DEADLINE_HAS_EXPIRED, UNREGISTERED_IP, TEMPORARILY_DISABLE_THE_SERVICEKEY]
  limit_codes: ["22"]
  limit_words: [LIMITED_NUMBER_OF_SERVICE_REQUESTS]

# 행동요령 대상 필터 (ADR-015): 일반 시민용이 아닌 행(구조대원·관리자·전문가 작업 지침)은 근거에서 뺀다.
# 판정은 mcp_server/guides.py for_citizens (코드). 단계명(safety_cate_nm3)·본문 키워드 기준, cate2 "*" = 모든 유형.
# 근거: doc/API_응답_스키마.md §4 + 2026-10-20 수집 fixture 를 읽고 정함 (T-031).
guide_audience:
  exclude_sections:
    - {cate2: "03013", words: [차량에서의 구조, 상황판단, 구출]}   # 교통사고: 구조대원 작업 지침 ("작업을 부여 받은 대원…")
    - {cate2: "02022", words: [식별]}                              # 테러: 식별요령 (현재 미연결, 연결 시 대비)
  exclude_text_words: [현장통제를 구축, 차량을 전개, "관련근거 :"]   # 비교는 정규화(앞 기호 제거) 뒤 본문 기준

# 공식 데이터에 없는 질문 (ADR-015). 모든 단어 묶음에서 하나 이상이 질문에 있으면 route=not_in_data →
# LLM·도구 없이 "공식 데이터에 없음" 고정 응답 (지어내지 않는다). 위급 표현이 있으면 emergency 가 먼저다.
# 근거: 행동요령 4종 1,466행 검색에서 차량+침수 0건, 지하차도·목받침 0건 (doc/API_응답_스키마.md §4)
not_in_official_data:
  - topic: 차량 침수 시 탈출
    all_of:
      - [차량, 자동차, 차가, 차 안, 차에서, 차를, 운전 중]
      - [침수, 물에 잠, 잠기, 물이 차, 지하차도]
      - [탈출, 빠져나, 문이 안 열, 창문, 깨고, 요령, 방법, 어떻게]

# 행동요령 구조화 "그래서 어떻게" (ADR-016). 판정은 backend/agent/judge.py group_guides (코드), 여기는 데이터만.
#   1) 본문에 dont_words 가 있으면 '하지 말 것'  2) 아니면 단계(hazard_map phases, cate3 기준)로 phase_to_group
#   info·after 단계는 묶음에 넣지 않는다(참고·사후 정보). 특보 발효 중인 유형은 now 를 먼저, 아니면 prepare 를 먼저 보인다.
guide_groups:
  dont_words: [맙시다, 마십시오, 말아야, 지 않습니다, 삼가]   # 2026-10-20 fixture 에서 확인 ('말고'·'피합니다'는 행동 지시와 섞여 제외)
  phase_to_group: {during: now, prepare: prepare}
  limits: {now: 3, prepare: 2, dont: 2}
  order_active: [now, prepare, dont]
  order_inactive: [prepare, now, dont]
