# 전국 지역 데이터 생성 입력 (mcp_server/tools/gen_regions.py → data/regions.json). 데이터만 — 해석 규칙은 regions.py (코드).
# 구역 구조는 data/kma_zones.json(기상청 특보구역코드안내 260601 추출). 손으로 쓴 지역(gwangju_metro, gyeonggi_gwangju)은 덮어쓰지 않는다.
#
# 재난문자·카카오·쉼터 주소의 시도 표기는 소스마다 신구 명칭이 섞인다(2026-10-20 재난문자 fixture 실측):
#   강원·전북·제주는 정식 명칭(…특별자치도), 전라남도 시군은 '전남광주통합특별시 …'와 '전라남도 …'가 섞여 온다.
# → 시도마다 허용 목록(prefixes)을 두고, 시군 이름으로 확정한다. 첫 값이 표시 이름.
# bbox: 시도 단위 위경도 사각형(대략, 섬 포함) — 쉼터 조회 범위(shelter_area). 사각형 안 다른 시군 시설은 주소 접두어로 거른다.
#   시군 단위 경계 데이터가 없어 시도 단위로 둔다(큰 도는 첫 몇 쪽에 해당 시군 시설이 없을 수 있다 → 쉼터 없이 정상 응답).

sido:
  서울특별시:     {prefixes: [서울특별시], short: [서울], bbox: {lat: [37.41, 37.72], lot: [126.76, 127.19]}}
  부산광역시:     {prefixes: [부산광역시], short: [부산], bbox: {lat: [34.87, 35.4], lot: [128.76, 129.31]}}
  대구광역시:     {prefixes: [대구광역시], short: [대구], bbox: {lat: [35.6, 36.33], lot: [128.35, 128.86]}}
  인천광역시:     {prefixes: [인천광역시], short: [인천], bbox: {lat: [37.0, 37.98], lot: [124.6, 126.8]}}
  광주광역시:     {prefixes: [광주광역시, 전남광주통합특별시], short: []}    # 손으로 쓴 gwangju_metro 가 담당
  대전광역시:     {prefixes: [대전광역시], short: [대전], bbox: {lat: [36.18, 36.5], lot: [127.24, 127.56]}}
  울산광역시:     {prefixes: [울산광역시], short: [울산], bbox: {lat: [35.32, 35.73], lot: [128.96, 129.47]}}
  세종특별자치시: {prefixes: [세종특별자치시], short: [], weak: [세종], bbox: {lat: [36.4, 36.74], lot: [127.13, 127.41]}}       # '세종로'(서울) 등과 겹쳐 약한 별칭
  경기도:         {prefixes: [경기도], short: [경기], bbox: {lat: [36.89, 38.29], lot: [126.37, 127.86]}}
  강원도:         {prefixes: [강원특별자치도, 강원도], short: [강원], bbox: {lat: [37.02, 38.62], lot: [127.08, 129.37]}}
  충청북도:       {prefixes: [충청북도], short: [충북], bbox: {lat: [36.0, 37.27], lot: [127.27, 128.66]}}
  충청남도:       {prefixes: [충청남도], short: [충남], bbox: {lat: [35.97, 37.07], lot: [125.5, 127.66]}}
  전북자치도:     {prefixes: [전북특별자치도, 전라북도], short: [전북], bbox: {lat: [35.28, 36.16], lot: [125.9, 127.93]}}
  전라남도:       {prefixes: [전라남도, 전남광주통합특별시], short: [전남], bbox: {lat: [33.8, 35.52], lot: [125.0, 127.92]}}
  경상북도:       {prefixes: [경상북도], short: [경북], bbox: {lat: [35.57, 37.56], lot: [127.8, 131.9]}}
  경상남도:       {prefixes: [경상남도], short: [경남], bbox: {lat: [34.46, 35.92], lot: [127.57, 129.23]}}
  제주도:         {prefixes: [제주특별자치도], short: [제주], bbox: {lat: [33.1, 34.0], lot: [126.08, 126.98]}}

# 광역시의 구·군 (특보구역표에 없다). 특보는 광역시 단위로 보고, 구 이름으로 물으면 "시 전체 기준"임을 밝힌다.
# 여러 광역시에 같은 이름이 있으면(중구·동구·서구·남구·북구·강서구) 약한 별칭 → 후보가 여럿이면 되묻기.
# 인천은 2026-07-01 개편 이름(제물포구·영종구·서해구·검단구)과 옛 이름을 모두 둔다.
metro_districts:
  서울특별시: [종로구, 중구, 용산구, 성동구, 광진구, 동대문구, 중랑구, 성북구, 강북구, 도봉구, 노원구, 은평구, 서대문구, 마포구,
             양천구, 강서구, 구로구, 금천구, 영등포구, 동작구, 관악구, 서초구, 강남구, 송파구, 강동구]
  부산광역시: [중구, 서구, 동구, 영도구, 부산진구, 동래구, 남구, 북구, 해운대구, 사하구, 금정구, 강서구, 연제구, 수영구, 사상구, 기장군]
  대구광역시: [중구, 동구, 서구, 남구, 북구, 수성구, 달서구, 달성군]
  인천광역시: [중구, 동구, 서구, 제물포구, 영종구, 서해구, 검단구, 미추홀구, 연수구, 남동구, 부평구, 계양구]
  대전광역시: [동구, 중구, 서구, 유성구, 대덕구]
  울산광역시: [중구, 남구, 동구, 북구, 울주군]

# 시군급이 아닌 특수 구역은 행정구역 시군에 붙인다 (그 시군의 특보 구역에 합친다)
attach:
  서해5도: [옹진군]
  흑산도.홍도: [신안군]
  추자도: [제주시]
  제주도산지: [제주시, 서귀포시]
  거문도.초도: [여수시]
# 시군 목록에 없는 특수 구역 → 독립 지역 (시도, 행정 이름, 추가 별칭)
special_regions:
  울릉도.독도: {sido: 경상북도, name: 울릉군, aliases: [울릉도, 독도, 울릉]}
extra_aliases:
  옹진군: [서해5도, 백령도, 연평도, 대청도]
  신안군: [흑산도, 홍도]

# '시·군'을 뗀 이름(줄임말)은 약한 별칭. 일상어·다른 뜻과 겹치는 줄임말은 별칭으로 쓰지 않는다
# (예: '진도 5 지진', '강진', '양산 챙기기', '고령 어르신', '음성 안내', '영양', '동해·남해 바다', '영동 지방').
short_alias_stopwords: [강진, 진도, 양산, 고령, 음성, 영양, 상주, 동해, 남해, 봉화, 화성, 영동, 구리, 이천, 오산, 광명, 양주,
                        공주, 예산, 보은, 장성, 영광, 완주, 장수, 경주, 진주, 의성, 사천, 인제, 청도, 광주]

# 같은 이름이 둘이어도 둘 다 조회해 보여 주는 묶음 (ADR-006, 시연 기본 동작). 그 밖의 동명·후보 여럿은 되묻기
show_both_groups:
  - [gwangju_metro, gyeonggi_gwangju]
