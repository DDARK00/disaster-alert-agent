# 데이터 소스 레지스트리 (ADR-013). 소스 출처·이용조건·키 이름의 단일 기준.
# 로더: mcp_server/registry.py — 기동 시 형식 검사(필수 필드·상태 값·환경변수 이름 규칙). 어기면 MCP 서버가 시작하지 않는다.
#
# 필드
#   title        표시 이름 (출처 표기·[G#] 인용에 쓴다)
#   provider     제공기관
#   portal_id    공공데이터포털 번호 (모르면 null — 확인 필요)
#   api_id       API 식별자 (safetydata DSSP-IF-…, 기상청 서비스명)
#   base         엔드포인트 (키 제외)
#   env          서비스키 환경변수 이름 (값은 .env 에만, mcp 컨테이너에만 주입)
#   env_legacy   옛 이름 (전환 기간 폴백 — 읽으면 경고 1회, 전환이 끝나면 삭제)
#   license      이용조건과 확인 날짜
#   attribution  출처 표기 문구
#   daily_limit  일일 호출 한도 (null = 별도 한도 없음/미확인). 자체 카운터가 넘으면 호출하지 않고 rate_limited
#   kind         alerts | messages | guide | shelter
#   page_size    한 쪽 행 수 (guide·shelter)
#   categories   유형 코드 → 이름 (guide). safety_cate 에 넣는 5자리 코드. hazard_map 에 연결한 유형만 둔다
#                (전체 유형 목록은 doc/API_응답_스키마.md §3 — 범위는 작게 시작, 늘릴 때 대상 필터 규칙도 함께 검토)
#   cache        호출 전략: request(요청마다) | daily(일 1회, 디스크 fixture 폴백) | region_hours(지역 단위 수 시간)
#   fixture_dir  data/fixtures/ 아래 폴더 (replay 원본, 커밋됨)
#   status       active(서비스 응답에 사용) | evaluating(사용 안 함) | blocked

