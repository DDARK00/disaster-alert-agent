<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재난·특보 상황 판단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 방향: 공공 안전 표지 (doc/FE_개선_계획.md). 대담한 요소는 판정 띠 하나 */
:root{
  --paper:#F1F3F2; --surface:#FBFCFC; --ink:#13202A; --sub:#55616C; --line:#D5DBDA;
  --signal:#F5C400; --signal-ink:#13202A; --alarm:#D3241C; --alarm-ink:#fff; --severe:#8E0F0B;
  --official:#0A5BAA; --official-soft:#DCE8F5; --hatch:#69737E; --hatch-soft:#E3E7EA; --calm:#DDE3E1;
  --ai:#0E7C66;   /* AI가 관여한 노드 (발표 슬라이드 3번과 같은 초록) */
  --display:"Black Han Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --text:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121A21; --surface:#18222B; --ink:#E6ECF0; --sub:#9AA7B2; --line:#2B3843;
    --official:#5FA2E8; --official-soft:#1B3550; --hatch:#8C97A2; --hatch-soft:#26313B; --calm:#25303A; --ai:#3FB89A;
  }
}
:root[data-theme="dark"]{
  --paper:#121A21; --surface:#18222B; --ink:#E6ECF0; --sub:#9AA7B2; --line:#2B3843;
  --official:#5FA2E8; --official-soft:#1B3550; --hatch:#8C97A2; --hatch-soft:#26313B; --calm:#25303A; --ai:#3FB89A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--text);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--official);outline-offset:2px}

/* 면책 띠 (화면에 한 번만 — 답변의 같은 줄은 표시 생략) + 개발자 보기 토글 */
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);padding:8px 16px;font-size:13px;line-height:1.45}
.top p{margin:0;max-width:880px}
.devsw{flex:none;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.devsw input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--hatch);position:relative;cursor:pointer;margin:0}
.devsw input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:left .15s}
.devsw input:checked{background:var(--official)}
.devsw input:checked::after{left:17px}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px}
h1{font:600 18px/1.3 var(--text);margin:22px 0 12px}
.scns{display:flex;flex-wrap:wrap;gap:6px}
.scn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 10px;font-size:13px;cursor:pointer}
.scn:hover{border-color:var(--official)}
.scn[aria-pressed="true"]{background:var(--official);border-color:var(--official);color:#fff}
#scnNote{font-size:13px;color:var(--sub);margin:8px 0 0;min-height:1.3em}
form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
input[type=text],select{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 12px;width:100%}
#q{font-size:16px}
.go{border:0;background:var(--ink);color:var(--paper);border-radius:4px;padding:0 22px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5;cursor:progress}

/* 노선도: 판단 → 근거 → 요약 정보 → 최종 답 (SSE judgement / evidence / quick / final) */
.rail{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0 0;padding:0}
.st{position:relative;padding:22px 12px 0 0}
.st::before{content:"";position:absolute;top:7px;left:0;right:0;height:4px;background:var(--line)}
.st:first-child::before{left:8px}
.st:last-child::before{right:auto;width:8px}
.st.done::before,.st.skip::before{background:var(--ink)}
.dot{position:absolute;top:0;left:0;width:18px;height:18px;border-radius:50%;background:var(--paper);border:4px solid var(--line);z-index:1}
.st.run .dot{border-color:var(--official);animation:pulse 1.2s ease-in-out infinite}
.st.done .dot{background:var(--ink);border-color:var(--ink)}
.st.skip .dot{border-color:var(--ink)}
.st.gap .dot{border-color:var(--hatch);background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,var(--paper) 2px 5px)}
.st b{display:block;font-size:15px;font-weight:600}
.st.wait b{color:var(--sub);font-weight:400}
.st span{display:block;font-size:13px;color:var(--sub);line-height:1.45;margin-top:2px}
.st.run span{color:var(--official)}
.st span:empty::before{content:"\00a0"}   /* 요약이 없는 정거장도 줄 높이를 지켜 세부 노드 줄이 나란히 */
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--official-soft)}}
/* 정거장 아래 세부 노드: 지나가는 순서대로 한 줄씩. AI 노드는 초록 원, 코드 노드는 먹색 사각 (색만으로 구분하지 않게 모양도 다름) */
.nodes{list-style:none;margin:8px 0 0;padding:0;font-size:13px;line-height:1.45}
.nodes li{display:flex;gap:7px;padding:2px 0;animation:enter .25s ease-out}
.nodes li::before{content:"";flex:none;width:8px;height:8px;margin-top:5px;background:var(--ink)}
.nodes li.ai::before{background:var(--ai);border-radius:50%}
.nodes li.run::before{animation:dim 1s ease-in-out infinite}
@keyframes dim{50%{opacity:.3}}
.nodes b{font-weight:600;flex:none}
.nodes li.ai b{color:var(--ai)}
.nodes .dt{color:var(--sub)}
.nodes li.bad .dt{color:var(--alarm)}
.nodes li.gap .dt{color:var(--hatch)}
.nodes .drop{color:var(--alarm)}
.nodes .ms{display:none;color:var(--official);margin-left:auto;padding-left:6px;white-space:nowrap}
body.devon .nodes .ms{display:inline}
@keyframes enter{from{opacity:0;transform:translateY(-3px)}}
.legend{display:flex;gap:16px;margin:12px 0 0;font-size:12px;color:var(--sub)}
.legend[hidden]{display:none}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:8px;height:8px;background:var(--ink)}
.legend i.ai{background:var(--ai);border-radius:50%}
#progress{margin:14px 0 0;font-size:14px;color:var(--official);min-height:1.5em}
#progress.bad{color:var(--sub);padding-left:10px;border-left:4px solid var(--hatch)}

/* 결과: 왼쪽 판정·답변, 오른쪽 공식 근거 */
.result{display:grid;grid-template-columns:minmax(0,620px) minmax(0,1fr);gap:40px;margin-top:22px;align-items:start}
.result[hidden]{display:none}
.band{padding:14px 18px 12px;margin-bottom:10px;background:var(--calm);color:var(--ink);border-radius:2px}
.band strong{display:block;font:400 28px/1.2 var(--display);letter-spacing:.01em}
.band strong+strong{margin-top:2px}
.band small{display:block;font-size:13px;margin-top:6px;opacity:.85}
.band.upcoming{background:var(--surface);box-shadow:inset 0 0 0 4px var(--signal)}
.band.advisory{background:var(--signal);color:var(--signal-ink)}
.band.warning{background:var(--alarm);color:var(--alarm-ink)}
.band.severe{background:var(--severe);color:#fff}
.band.unknown,.band.gap{background:repeating-linear-gradient(135deg,var(--hatch-soft) 0 10px,var(--surface) 10px 20px);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.band.emergency{background:var(--alarm);color:var(--alarm-ink)}
.band.ask{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)}
#links{margin:4px 0 12px;font-size:13px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:3px 9px;margin:4px 6px 0 0;color:inherit;text-decoration:none;font-size:13px;background:var(--surface)}
a.pill{border-color:var(--official);color:var(--official)}
#links .note{display:block;color:var(--sub);margin-top:4px}
#sumhead{font-size:13px;color:var(--sub);margin:18px 0 6px}
#sumhead.ok{color:var(--official)}
#answer h4{font-size:18px;margin:20px 0 6px}
#answer h5{font-size:15px;margin:18px 0 4px;padding-left:10px;border-left:4px solid var(--ink)}
#answer h5.dont{border-left-color:var(--alarm)}
#answer p{margin:6px 0}
#answer ul{margin:4px 0;padding-left:22px}
#answer ul ul{padding-left:18px;color:var(--sub)}
#answer li{margin:3px 0}
#answer.typing::after{content:"▍";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cite{font-size:11px;font-weight:600;color:var(--official);background:var(--official-soft);border:0;border-radius:3px;padding:0 5px;margin-left:4px;cursor:pointer;vertical-align:1px}
.cite:hover,.cite.on{background:var(--official);color:#fff}

aside h2{font-size:15px;margin:0 0 4px}
aside .rg{font-size:13px;color:var(--sub);margin:16px 0 4px}
aside .scope{font-size:13px;color:var(--sub);margin:4px 0}
.ev{list-style:none;margin:0;padding:0}
.ev li{padding:7px 0 7px 12px;border-left:3px solid var(--official);margin:6px 0;font-size:14px;line-height:1.5;transition:background .2s}
.ev li.on{background:var(--official-soft)}
.ev li .k{display:block;font-size:12px;color:var(--official);font-weight:600}
.ev li.gap{border-left-color:var(--hatch);background:repeating-linear-gradient(135deg,var(--hatch-soft) 0 6px,transparent 6px 12px)}
.ev li.gap .k{color:var(--sub)}
.grp{font-size:13px;font-weight:600;margin:14px 0 0}
.grp.dont{color:var(--alarm)}
.shdr{font-size:12px;color:var(--sub);margin:14px 0 0}

.opts{grid-column:1/-1;display:flex;gap:10px 16px;flex-wrap:wrap;font-size:13px;color:var(--sub);align-items:center}
.opts label{display:flex;gap:6px;align-items:center}
.opts select,.opts input{width:auto;padding:5px 8px}
/* 개발자 보기: 노드별 소요 시간과 오류 주입만 (일반 화면에는 숨김) */
body:not(.devon) .dev{display:none}
.err{color:var(--alarm);font-weight:600}

@media (max-width:860px){
  .result{grid-template-columns:1fr;gap:24px}
}
@media (max-width:560px){
  .top{flex-direction:column;align-items:flex-start;gap:6px}
  form{grid-template-columns:1fr}
  .go{padding:11px}
  .scns{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .scn{flex:none}
  .rail{grid-template-columns:repeat(2,1fr);row-gap:14px}
  .st:nth-child(2)::before{right:auto;width:8px}
  .st:nth-child(3)::before{left:8px}
  .band strong{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <!-- 면책은 화면에 한 번만: 이 문장이 답변의 면책 줄(prompts/messages.yaml disclaimer)과 같다 (답변 쪽 같은 줄은 표시만 생략) -->
  <p role="note" id="disclaimer">공식 데이터(기상청·행정안전부)를 정리한 안내로, 공식 경보를 대신하지 않습니다. 위급하면 즉시 119·112에 연락하고 공식 채널(기상청, 재난문자, 국민재난안전포털)에서 최종 확인해 주세요.</p>
  <label class="devsw"><input type="checkbox" id="devToggle"> 개발자 보기</label>
</header>
<main class="wrap">
  <h1>재난·특보 상황 판단</h1>
  <div class="scns" id="scenarios" role="group" aria-label="예시 질문"></div>
  <p id="scnNote"></p>
  <form id="f">
    <input type="text" id="q" placeholder="예: 경기도 광주 폭염특보 났는데 지금 나가도 돼?" maxlength="500" aria-label="질문" required>
    <button class="go" id="send" type="submit">물어보기</button>
    <div class="opts">
      <label>데이터 <select id="mode"><option value="replay">replay (저장된 실제 데이터)</option><option value="live">live (지금 조회)</option></select></label>
      <label>기준 시각 <input type="text" id="asof" placeholder="2026-08-24 12:00" size="16"></label>
      <label class="dev">오류 주입 <select id="fault"><option value="">없음</option></select></label>
      <span class="dev" id="faultNote"></span>
    </div>
  </form>

  <ol class="rail" id="rail" aria-label="처리 단계" hidden>
    <li class="st wait" id="st-judge"><i class="dot"></i><b>판단</b><span></span><ul class="nodes" id="nl-judge"></ul></li>
    <li class="st wait" id="st-evidence"><i class="dot"></i><b>근거</b><span></span><ul class="nodes" id="nl-evidence"></ul></li>
    <li class="st wait" id="st-quick"><i class="dot"></i><b>요약 정보</b><span></span><ul class="nodes" id="nl-quick"></ul></li>
    <li class="st wait" id="st-final"><i class="dot"></i><b>최종 답</b><span></span><ul class="nodes" id="nl-final"></ul></li>
  </ol>
  <p class="legend" id="legend" hidden><span><i class="ai"></i>AI가 관여한 단계</span><span><i></i>코드가 처리한 단계</span></p>
  <p id="progress" aria-live="polite"></p>

  <div class="result" id="result" hidden>
    <section aria-label="답변">
      <div id="bands"></div>
      <div id="links"></div>
      <p id="sumhead"></p>
      <div id="answer" aria-live="polite"></div>
    </section>
    <aside aria-label="확인된 근거" id="evbox" hidden>
      <h2>근거 (공식 데이터)</h2>
      <div id="evidence"></div>
    </aside>
  </div>

</main>

<script>
"use strict";
const API = new URLSearchParams(location.search).get("api") || "/api";
const KIND_KO = {alert:"기상특보",pending:"특보 예고",released:"특보 해제",message:"재난문자",guide:"행동요령",shelter:"쉼터·대피장소"};
// 고정 안내 경로는 판정 띠 자리에 칩 (판정·근거 단계를 거치지 않음)
const ROUTE_BAND = {not_in_data:["gap","정보 없음"],unavailable:["gap","정보 없음"],emergency:["emergency","위급 — 119·112"],ask_region:["ask","지역 확인 필요"],out_of_scope:["ask","재난·특보 밖 질문"]};
const DISCLAIMER = document.getElementById("disclaimer").textContent.trim();
const $ = id => document.getElementById(id);
let es = null, lastRegion = "", evById = {}, shown = "", running = "";

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

// 개발자 보기 — 기억은 이 브라우저에만 (저장이 막혀도 꺼짐으로 동작)
function setDev(on){ document.body.classList.toggle("devon",on); $("devToggle").checked=on; try{ localStorage.setItem("dev",on?"1":"0"); }catch(e){} devTitles(); }
// 검증 위반 사유는 개발자 보기에서만 마우스를 올리면 보인다
function devTitles(){ const on=document.body.classList.contains("devon"); document.querySelectorAll(".nodes li[data-why]").forEach(li=>li.title=on?li.dataset.why:""); }
$("devToggle").addEventListener("change",e=>setDev(e.target.checked));
(()=>{ let on=new URLSearchParams(location.search).get("dev")==="1"; try{ on=on||localStorage.getItem("dev")==="1"; }catch(e){} setDev(on); })();

async function loadScenarios(){
  try{
    const list = await (await fetch(API+"/scenarios")).json();
    const faults = list.filter(s=>s.fault);   // DEMO_FAULTS=1 인 서버에서만 온다 (ADR-021)
    list.filter(s=>!s.fault).forEach(s=>{
      const b = el("button","scn",s.title); b.type="button"; b.setAttribute("aria-pressed","false");
      b.onclick = ()=>{ lastRegion=""; document.querySelectorAll(".scn").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true");
        $("q").value=s.message; $("mode").value=s.mode; $("asof").value=s.as_of||""; $("scnNote").textContent=s.note||""; run(); };
      $("scenarios").appendChild(b);
    });
    faults.forEach(s=>{ const o=el("option",null,s.title.replace(/^오류 원인:\s*/,"")); o.value=s.fault; $("fault").appendChild(o); });
    $("fault").disabled=!faults.length;
    $("faultNote").textContent=faults.length?"":"서버에서 꺼져 있음 (DEMO_FAULTS=1)";
  }catch(e){ $("scnNote").textContent="예시 질문을 불러오지 못했습니다. 질문을 직접 입력해 주세요."; $("scnNote").className="err"; }
}

// ── 노선도: 정거장 4개 + 그 아래 실제로 지나간 세부 노드 (SSE step 순서 그대로) ──
const STATIONS=["judge","evidence","quick","final"];
const NODE_AT={parse_intent:"judge",gate:"judge",plan:"judge",research:"evidence",judge:"evidence",
  write:"final",validate:"final",fallback:"final",fixed_response:"final",ask_region:"final",unavailable:"final"};
const NODE_NAME={parse_intent:"의도 파악",gate:"지역 확정",plan:"계획",research:"조회",judge:"판정",write:"작성",validate:"검증",
  fallback:"고정 양식 전환",fixed_response:"고정 안내",ask_region:"되묻기",unavailable:"연결 실패 안내"};
// LLM을 부르는 노드. 계획은 지금 코드 규칙 표라(ADR-018) plan 이벤트의 source 가 rules 가 아닐 때만 초록으로 바꾼다
const AI_NODES=new Set(["parse_intent","write"]);
const INTENT_KO={go_out:"외출 판단",status:"상황 확인",guide:"행동요령"};
const STEP_KO={alerts:"특보",messages:"문자",guide:"행동요령"};
const FIXED_KO={emergency:"위급 표현 → 119·112 안내",out_of_scope:"재난·특보 밖 질문",not_in_data:"공식 데이터에 없는 항목"};
let nodeLi={}, writes=0, srcs={}, askedHazards=[];
function station(id,state,text){
  const s=$("st-"+id); s.className="st "+state; if(text!=null) s.querySelector("span").textContent=text;
  if(state==="run") running=id; else if(running===id) running="";
}
function advance(id){   // 앞 정거장: 진행 중이면 완료, 거치지 않았으면 해당 없음
  STATIONS.slice(0,STATIONS.indexOf(id)).forEach(p=>{ const c=$("st-"+p).className;
    const ran=$("nl-"+p).children.length>0;   // 세부 노드를 하나도 거치지 않은 정거장은 해당 없음 (고정 안내 경로)
    if(/run/.test(c)&&ran) station(p,"done"); else if(/run|wait/.test(c)) station(p,"skip","해당 없음"); });
  if(!/run|done/.test($("st-"+id).className)) station(id,"run");
}
function nodeLine(at,name,ai){
  const li=el("li",ai?"ai run":"run"); li.append(el("b",null,name),el("span","dt"),el("span","ms"));
  $("nl-"+at).appendChild(li); return li;
}
function stepEvent(d){
  const at=NODE_AT[d.node]; if(!at) return;   // route·finalize 는 내부 연결 노드
  if(d.status==="start"){
    advance(at);
    const name=d.node==="write"&&writes++>0?"재작성":NODE_NAME[d.node];   // 검증 위반 뒤 다시 쓰면 그대로 보인다
    nodeLi[d.node]=nodeLine(at,name,AI_NODES.has(d.node));
    if(d.node==="fallback") detail("fallback","기본 요약으로 바꾸는 중");
  } else {
    const li=nodeLi[d.node]; if(!li) return;
    li.classList.remove("run"); if(d.ms!=null) li.querySelector(".ms").textContent=d.ms+"ms";   // 숫자는 개발자 보기에서만 보임
  }
}
function detail(node,text,cls){ const li=nodeLi[node]; if(!li) return; li.querySelector(".dt").textContent=text; if(cls) li.classList.add(cls); }

function resetView(){
  ["bands","links","answer","evidence"].concat(STATIONS.map(s=>"nl-"+s)).forEach(i=>$(i).replaceChildren());
  evById={}; shown=""; running=""; nodeLi={}; writes=0; srcs={}; askedHazards=[];
  $("result").hidden=true; $("evbox").hidden=true; $("sumhead").textContent=""; $("sumhead").className=""; $("sumhead").title="";
  $("progress").textContent=""; $("progress").className=""; $("rail").hidden=false; $("legend").hidden=false;
  STATIONS.forEach(s=>station(s,"wait",""));
}

// ── 판단 ────────────────────────────────────────
function showLocation(d){
  const names=d.candidates.map(c=>c.name);
  // 같은 이름이 여러 곳이면 광주처럼 둘 다 조회(show_both)하거나, 그 밖은 되묻는다(ask)
  const t=d.status==="ambiguous"?names.join(", ")+(d.ask?" — 어느 곳인지 되묻기":" — 모두 조회"):names[0]?names[0]+(d.status==="assumed"?" (가정)":""):"지역 없음";
  detail("gate",t); $("st-judge").querySelector("span").textContent=t;
}
// 판정 띠 제목: 특보마다 "폭염경보 발효 중" (경보 먼저, 예고는 뒤). 띠 색은 코드가 정한 전체 수준(j.level = 가장 높은 등급)
const GRADE_RANK={"경보":0,"주의보":1};
function bandLines(j){
  const ev=j.evidence||[], uniq=a=>[...new Set(a)];
  const byRank=(a,b)=>(GRADE_RANK[a.level]??9)-(GRADE_RANK[b.level]??9);
  const act=uniq(ev.filter(e=>e.kind==="alert").sort(byRank).map(e=>e.hazard+(e.level||"특보")+" 발효 중"));
  const pend=uniq(ev.filter(e=>e.kind==="pending").sort(byRank).map(e=>e.hazard+(e.level||"특보")+" 발효 예고"));
  if(act.length||pend.length) return act.concat(pend);
  const hz=((j.hazards||[]).length?j.hazards:askedHazards).join("·");   // 특보 조회가 실패하면 판정에 유형이 없다 → 질문에서 읽은 유형
  if(j.level==="unknown") return [(hz?hz+" 특보":"특보")+" · 정보 없음"];   // 무엇을 찾았는데 모르는지
  return [hz?hz+" · "+j.level_label:j.level_label];
}
function showJudgements(js){
  $("result").hidden=false; const box=$("bands"); box.replaceChildren();
  js.forEach(j=>{
    const b=el("div","band "+j.level); bandLines(j).forEach(t=>b.appendChild(el("strong",null,t)));
    // 특보구역은 이름으로, 코드는 툴팁(개발자용)에만
    const sm=el("small",null,j.region+(j.as_of&&j.as_of!=="-"?" · 기준 "+j.as_of:"")+(j.zone_names&&j.zone_names.length?" · 특보구역 "+j.zone_names.join(", "):"")+(j.uncertain?" · 해석이 불확실한 항목 포함":""));
    sm.title="특보구역 코드: "+j.zones.join(", "); b.appendChild(sm); box.appendChild(b);
  });
  detail("judge",js.map(j=>(js.length>1?j.region.replace(/^\S+도 /,"")+" ":"")+bandLines(j).join(", ")).join(" / "));
}
// 카카오맵 링크 칩 (경로 판단 없음 — 카카오맵으로 넘기기까지만). 서버 검사 후에도 형식을 다시 확인한다
const KAKAO_LINK=/^https:\/\/map\.kakao\.com\/link\/(map|to)\/\d+$/;
// 쉼터: 이름·주소 검색 링크 (서버가 만든 형식만). 운영 여부·경로는 반영되지 않는다
const KAKAO_SEARCH=/^https:\/\/map\.kakao\.com\/link\/search\/[0-9A-Za-z%._~-]+$/;
function showLinks(d){
  const box=$("links"); box.replaceChildren();
  const ok=(d.chips||[]).filter(c=>KAKAO_LINK.test(c.url));
  if(!ok.length||!d.notice) return;
  box.appendChild(el("span","pill",d.region));
  ok.forEach(c=>{ const a=el("a","pill",c.label); a.href=c.url; a.target="_blank"; a.rel="noopener noreferrer"; box.appendChild(a); });
  box.appendChild(el("span","note",d.notice));
}

// ── 근거 ────────────────────────────────────────
function evList(box,items){
  if(!items.length) return; const ul=el("ul","ev");
  items.forEach(e=>{
    evById[e.id]=e;
    const li=el("li"); li.dataset.id=e.id;
    li.appendChild(el("span","k",e.id+" "+(KIND_KO[e.kind]||e.kind)));
    li.appendChild(document.createTextNode(e.text));
    if(e.kind==="shelter"&&KAKAO_SEARCH.test(e.map_url||"")){
      const a=el("a","pill","카카오맵에서 찾기"); a.href=e.map_url; a.target="_blank"; a.rel="noopener noreferrer";
      a.title="이름·주소 검색 결과로 넘어갑니다. 운영 여부와 경로상의 통제·침수 여부는 반영되지 않았습니다."; li.appendChild(document.createElement("br")); li.appendChild(a);
    }
    ul.appendChild(li);
  });
  box.appendChild(ul);
}
function showEvidence(d){
  const box=$("evidence"); box.replaceChildren(); $("evbox").hidden=false; $("result").hidden=false;
  const n={alert:0,message:0,guide:0,shelter:0,gap:0};
  d.regions.forEach(r=>{
    if(d.regions.length>1) box.appendChild(el("p","rg",r.region));
    if(r.scope_note) box.appendChild(el("p","scope",r.scope_note));
    if(r.note) box.appendChild(el("p","scope",r.note));
    evList(box,r.alerts); evList(box,r.messages); n.alert+=r.alerts.length; n.message+=r.messages.length;
    r.guide_groups.forEach(g=>{ box.appendChild(el("p","grp "+g.group,g.label)); evList(box,g.items); n.guide+=g.items.length; });
    if(r.shelters){ box.appendChild(el("p","shdr",r.shelters.header)); evList(box,r.shelters.items); n.shelter+=r.shelters.items.length; }
    if(r.gaps.length){
      const ul=el("ul","ev");
      r.gaps.forEach(g=>{
        // 사용자 문구는 백엔드가 준 원인별 문구(reason), 원인 코드·상세는 툴팁(개발자용)에만
        const li=el("li","gap"); li.appendChild(el("span","k","정보 없음 · "+g.source));
        li.appendChild(document.createTextNode(g.reason||"불러오지 못했습니다")); li.title=[g.cause||g.status,g.detail||""].join(" · ");
        ul.appendChild(li); n.gap++;
      });
      box.appendChild(ul);
    }
  });
  const parts=[["특보",n.alert],["문자",n.message],["행동요령",n.guide],["쉼터",n.shelter],["정보 없음",n.gap]].filter(x=>x[1]).map(x=>x[0]+" "+x[1]);
  station("evidence","done",parts.join(" · ")||"확인된 근거 없음");
  advance("quick");
}
function highlight(id){
  document.querySelectorAll(".ev li").forEach(li=>li.classList.toggle("on",li.dataset.id===id));
  document.querySelectorAll(".cite").forEach(c=>c.classList.toggle("on",c.textContent===id));
  const t=document.querySelector('.ev li[data-id="'+id+'"]'); if(t) t.scrollIntoView({block:"nearest",behavior:"smooth"});
}

// ── 답변 렌더링: ###, ▶ 묶음 제목, 들여쓴 "- " 목록(한 단계 안쪽), [E1] 번호표. 텍스트는 textContent 로만 ──
function renderAnswer(text){
  const root=$("answer"); root.replaceChildren(); root.className=""; let ul=null, sub=null;
  const addCites=(parent,s)=>{
    s.split(/(\[[EMGS]\d+\])/).forEach(part=>{
      const m=/^\[([EMGS]\d+)\]$/.exec(part);
      if(m){ const c=el("button","cite",m[1]); c.type="button"; c.title=(evById[m[1]]||{}).text||""; c.onclick=()=>highlight(m[1]); parent.appendChild(c); }
      else if(part) parent.appendChild(document.createTextNode(part));
    });
  };
  text.split("\n").forEach(raw=>{
    const line=raw.trim(); if(!line||line===DISCLAIMER) return;   // 면책은 위 띠와 같은 문장 — 화면에는 한 번만
    const bullet=/^(\s*)[-•]\s+(.*)$/.exec(raw);
    if(line.startsWith("### ")){ ul=sub=null; root.appendChild(el("h4",null,line.slice(4))); }
    else if(line.startsWith("▶")){ ul=sub=null; const t=line.replace(/^▶\s*/,""); root.appendChild(el("h5",/하지 말/.test(t)?"dont":null,t)); }
    else if(bullet){
      const li=el("li"); addCites(li,bullet[2]);
      // 번호표로 끝나는 항목(근거 한 건)은 들여쓰기와 상관없이 같은 단계 — 모델이 쉼터 [S2]·[S3]를 들여 써도 [S1] 아래로 넣지 않는다
      const cited=/\[[EMGS]\d+\][\s.]*$/.test(bullet[2]); if(cited) li.dataset.cited="";
      if(!cited&&bullet[1].length>=2&&ul&&ul.lastChild&&!("loose" in ul.dataset)&&!("cited" in ul.lastChild.dataset)){ if(!sub){ sub=el("ul"); ul.lastChild.appendChild(sub);} sub.appendChild(li); }
      else { if(!ul){ ul=el("ul"); root.appendChild(ul);} sub=null; ul.appendChild(li); }
    }
    else { ul=sub=null; const p=el("p"); addCites(p,line); root.appendChild(p);
      if(raw.startsWith("  ")){ ul=el("ul"); ul.dataset.loose=""; root.appendChild(ul); } }   // 들여쓴 머리 줄 아래의 들여쓴 목록은 그 머리 줄의 목록
  });
}

// 답변 출처 한 줄. 모델·run id 는 툴팁에만 (시간 숫자는 개발자 보기의 노드 줄에만)
function llmLabel(name){ if(!name||name==="fake") return "테스트 모드(고정 응답)"; const i=name.indexOf(":"); return i>=0?name.slice(i+1):name; }
const FINAL_KO={llm:["ok","AI 답변 · 근거 검증 통과"],fake:["","고정 응답(테스트 모드)"],fixed:["","고정 안내"],template_fallback:["","기본 요약 유지 — AI 답변이 검증을 통과하지 못했습니다"],template_llm_error:["","기본 요약 유지 — AI 연결에 실패했습니다"]};
function showMeta(f){ const m=f.meta; $("sumhead").title="모델 "+llmLabel(m.llm)+" · 데이터 "+m.mode+" · run "+m.run_id; }
function srcKey(name){ return /특보/.test(name)?"특보":/문자/.test(name)?"문자":/행동요령/.test(name)?"행동요령":/쉼터/.test(name)?"쉼터":name; }

function run(){
  const q=$("q").value.trim(); if(!q) return;
  if(es){ es.close(); es=null; }
  resetView(); $("send").disabled=true;
  const p=new URLSearchParams({message:q, mode:$("mode").value});
  if($("asof").value.trim()) p.set("as_of",$("asof").value.trim());
  if($("fault").value) p.set("fault",$("fault").value);
  if(lastRegion) p.set("history_region_id",lastRegion);   // 서버는 상태를 갖지 않는다 — 이전 지역은 클라이언트가 전달
  const ans=$("answer"); let started=false;
  es=new EventSource(API+"/chat/stream?"+p);
  const on=(name,fn)=>es.addEventListener(name,e=>{ if(e.data) fn(JSON.parse(e.data)); });   // 연결 끊김의 기본 error 이벤트는 data 가 없다
  on("start",()=>station("judge","run"));
  on("step",stepEvent);
  on("progress",d=>{ $("progress").textContent=d.text; $("progress").className=d.stage==="source_failed"?"bad":""; });
  on("intent",d=>{ askedHazards=d.hazards||[]; const t=(INTENT_KO[d.intent]||d.intent)+(d.hazards.length?" · "+d.hazards.join("·"):"");
    if(/llm/.test(d.hazard_source||"")) detail("parse_intent",t);
    else { nodeLi.parse_intent?.classList.remove("ai"); detail("parse_intent",t+" (AI 없이 규칙으로)"); }
    // 질문에 근거 없어 버린 AI 유형은 개발자 보기에만 (T-039)
    if((d.hazards_dropped||[]).length&&nodeLi.parse_intent) nodeLi.parse_intent.querySelector(".dt").appendChild(el("span","dev drop"," · 제외: "+d.hazards_dropped.join("·")+"(질문에 없음)")); });
  on("location",showLocation);
  on("links",showLinks);
  on("plan",d=>{ const t=d.steps.map(x=>STEP_KO[x]||x).join(" + ");
    if(d.source!=="rules"){ nodeLi.plan?.classList.add("ai"); detail("plan",t); } else detail("plan",t+" (규칙 표)"); });
  on("source",d=>{ const k=srcKey(d.name), c=srcs[k]||(srcs[k]={n:0,bad:false}); c.n+=d.count||0; c.bad=c.bad||d.status!=="ok";
    // 조회 줄은 어느 소스를 확인했고 어느 것이 실패했는지만 — 개수는 근거 정거장 요약(evidence, 예고·여러 지역 포함)이 기준
    const parts=["특보","문자","행동요령","쉼터"].concat(Object.keys(srcs)).filter((k,i,a)=>srcs[k]&&a.indexOf(k)===i)
      .map(k=>srcs[k].bad?k+" 정보 없음":k);
    detail("research",parts.join(" · "),Object.values(srcs).some(c=>c.bad)?"gap":null); });
  on("judgement",d=>showJudgements(d.judgements));
  on("evidence",showEvidence);
  // 검증을 통과한 기본 요약을 먼저 보이고, AI 답변이 검증을 통과하면 final 에서 답변만 바꾼다 (판정·근거는 그대로)
  on("quick",d=>{ $("result").hidden=false; renderAnswer(d.answer); shown=d.answer;
    $("sumhead").textContent="기본 요약 · AI 답변을 작성·검증하는 중입니다";
    const li=nodeLine("quick","기본 요약",false); li.classList.remove("run"); li.querySelector(".dt").textContent="고정 양식 · 검증 통과";
    station("quick","done",""); });
  // 템플릿 대체의 검증(attempt "template")은 '고정 양식 전환' 줄에, AI 답변 검증은 그 시도의 '검증' 줄에 (T-040)
  on("validation",d=>{ const node=d.attempt==="template"?"fallback":"validate";
    detail(node,(node==="fallback"?"기본 요약 검증 ":"")+(d.ok?"통과":"위반 "+d.violations.length+"건"),d.ok?null:"bad");
    if(!d.ok&&nodeLi[node]){ nodeLi[node].dataset.why=d.violations.join("\n"); devTitles(); } });
  on("token",d=>{ if(shown) return;   // 요약이 이미 보이면 토큰을 덧쓰지 않고 final 에서 한 번에 교체
    if(!started){ started=true; $("result").hidden=false; ans.className="typing"; ans.textContent=""; } ans.textContent+=d.text; });
  on("final",f=>{
    $("result").hidden=false;
    if(f.answer!==shown) renderAnswer(f.answer);   // 같으면(기본 요약이 최종) 다시 그리지 않는다
    ans.className="";
    const rb=ROUTE_BAND[f.route];
    if(rb&&!(f.judgements||[]).length){   // 고정 안내: 판정 띠 자리에 칩. 정보 없음은 무엇을 찾았는지 함께
      const topic=f.route==="not_in_data"&&(/'([^']+)'/.exec(f.answer)||[])[1];   // messages.yaml fixed.not_in_data 의 '$topic'
      const label=topic?topic+" 요령 · 정보 없음":f.route==="unavailable"?"특보·재난문자 · 정보 없음":rb[1];
      const b=el("div","band "+rb[0]); b.appendChild(el("strong",null,label)); $("bands").replaceChildren(b);
    }
    if(FIXED_KO[f.route]) detail("fixed_response",FIXED_KO[f.route]);
    advance("final");
    const fk=FINAL_KO[f.answer_source]||["",f.answer_source||""];
    station("final","done",fk[1].split(" — ")[0]);
    $("sumhead").textContent=fk[1]; $("sumhead").className=fk[0];
    $("progress").textContent=""; $("progress").className=""; showMeta(f);
    const j=(f.judgements||[]); if(j.length===1) lastRegion=j[0].region_id; else if(f.location&&f.location.chosen) lastRegion=f.location.chosen;
    es.close(); es=null; $("send").disabled=false;
  });
  on("error",d=>{
    $("result").hidden=false; ans.className="";
    const p=el("p","err","정보 없음 — 답변을 만들지 못했습니다. 위험 여부는 공식 채널에서 확인해 주세요."); ans.replaceChildren(p);
    $("sumhead").title=d.message||""; station(running||"final","gap","정보 없음");
    $("progress").textContent=""; es&&es.close(); es=null; $("send").disabled=false;
  });
  es.onerror=()=>{ if(es&&es.readyState===EventSource.CLOSED){ $("send").disabled=false; } };
}
$("f").addEventListener("submit",e=>{ e.preventDefault(); document.querySelectorAll(".scn").forEach(x=>x.setAttribute("aria-pressed","false")); $("scnNote").textContent=""; run(); });
loadScenarios();
</script>
