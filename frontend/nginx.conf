server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 도커 내장 DNS. 백엔드가 늦게 떠도 nginx 가 기동 시점에 죽지 않게 변수로 프록시한다.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri /index.html;
  }

  # /api/* → backend:8100/*   (SSE: 버퍼링·압축을 끄고 읽기 제한을 늘린다)
  location /api/ {
    set $upstream http://backend:8100;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
    add_header X-Accel-Buffering no;
  }
}
